[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 6

[agents.explorer]
description = "Read-only repository explorer. Traces execution paths, finds relevant files and symbols, and reports concise findings."
config_file = "./agents/explorer.toml"

[agents.worker]
description = "Implementation worker for clearly bounded coding tasks."
config_file = "./agents/worker.toml"

[agents.reviewer]
description = "Independent reviewer for correctness, regressions, edge cases, and missing tests."
config_file = "./agents/reviewer.toml"