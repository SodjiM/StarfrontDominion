<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Log in · Starfront Dominion</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <a class="skip-link" href="#loginForm">Skip to login</a>
  <main class="login-shell">
    <a class="login-brand" href="/" aria-label="Starfront Dominion home">
      <img src="assets/branding/starfront-mark.svg" alt="">
      <span><strong>STARFRONT</strong><small>/ DOMINION</small></span>
    </a>

    <section class="login-card" aria-labelledby="login-title">
      <header class="login-heading">
        <p>Command access</p>
        <h1 id="login-title">Welcome back, Commander.</h1>
      </header>

      <form id="loginForm" novalidate>
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter your username" aria-describedby="error">
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <div class="password-control">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="error">
            <button id="togglePassword" class="password-toggle" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.4 5.5-9.5 5.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
            </button>
          </div>
        </div>

        <div id="error" class="login-message" role="alert" tabindex="-1" hidden></div>

        <button class="login-submit" type="submit" id="loginBtn">
          <span class="login-spinner" aria-hidden="true"></span>
          <span id="loginBtnLabel">Log in</span>
        </button>
        <p id="loginStatus" class="sr-only" role="status" aria-live="polite"></p>
      </form>

      <nav class="login-links" aria-label="Account options">
        <a href="register.html">Create an account</a>
        <span aria-hidden="true"></span>
        <a href="/">Back to main menu</a>
      </nav>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnLabel = document.getElementById('loginBtnLabel');
    const loginStatus = document.getElementById('loginStatus');
    const error = document.getElementById('error');
    const togglePassword = document.getElementById('togglePassword');

    function clearError() {
      error.hidden = true;
      error.textContent = '';
      username.removeAttribute('aria-invalid');
      password.removeAttribute('aria-invalid');
    }

    function showError(message, fields, focusTarget) {
      error.textContent = message;
      error.hidden = false;
      fields.forEach((field) => field.setAttribute('aria-invalid', 'true'));
      (focusTarget || error).focus();
    }

    function setBusy(isBusy) {
      loginBtn.disabled = isBusy;
      loginBtn.setAttribute('aria-busy', String(isBusy));
      loginBtn.classList.toggle('is-busy', isBusy);
      loginBtnLabel.textContent = isBusy ? 'Logging in…' : 'Log in';
      loginStatus.textContent = isBusy ? 'Logging in.' : '';
    }

    togglePassword.addEventListener('click', () => {
      const showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      togglePassword.setAttribute('aria-pressed', String(!showing));
      togglePassword.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      password.focus({ preventScroll: true });
    });

    username.addEventListener('input', clearError);
    password.addEventListener('input', clearError);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();

      const enteredUsername = username.value.trim();
      const enteredPassword = password.value;
      if (!enteredUsername || !enteredPassword) {
        const missing = [username, password].filter((field) => !field.value.trim());
        showError('Enter your username and password.', missing, missing[0]);
        return;
      }

      setBusy(true);
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: enteredUsername, password: enteredPassword }),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          password.value = '';
          showError(
            response.status === 401 ? 'Username or password is incorrect.' : (data.error || 'Login could not be completed. Try again.'),
            [username, password],
            password,
          );
          return;
        }

        localStorage.setItem('userId', data.userId);
        localStorage.setItem('username', data.username);
        loginStatus.textContent = 'Login successful. Opening the lobby.';
        window.location.href = 'lobby.html';
      } catch (requestError) {
        showError('Connection failed. Check your connection and try again.', [username, password], error);
      } finally {
        setBusy(false);
      }
    });

    username.focus();
  </script>
</body>
</html>
